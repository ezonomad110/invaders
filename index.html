<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SABER BREAKER v2 - ルミナス・インベーダー崩し</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#05010f;overflow:hidden}
  body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;color:#e0f2fe;
    display:flex;flex-direction:column;align-items:center;height:100dvh;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
  #wrap{position:relative;width:min(100vw,480px);flex:1;display:flex;flex-direction:column;min-height:0}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 4px;font-size:13px;letter-spacing:.06em}
  #hud b{color:#fff;text-shadow:0 0 8px #22d3ee}
  .hud-label{font-size:10px;color:#a5b4fc;display:block;letter-spacing:.15em}
  #hud button{background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.5);color:#bae6fd;border-radius:999px;padding:5px 12px;font-size:12px}
  #game{position:relative;flex:1;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(5,1,15,.74);z-index:5}
  #overlay.hidden{display:none}
  #overlay h1{font-size:30px;line-height:1.15;color:#fff;letter-spacing:.08em;text-shadow:0 0 6px #38bdf8,0 0 22px #38bdf8,0 0 44px #2563eb}
  #overlay h1 .pink{color:#ffe4f1;text-shadow:0 0 6px #f472b6,0 0 22px #f472b6,0 0 44px #db2777}
  #overlay p{margin-top:14px;font-size:13.5px;line-height:1.9;color:#cbd5e1;max-width:350px}
  #overlay p b{color:#7dd3fc}
  #bigBtn{margin-top:22px;background:#082f49;border:2px solid #38bdf8;color:#fff;font-size:17px;font-weight:700;letter-spacing:.12em;padding:13px 34px;border-radius:999px;box-shadow:0 0 18px rgba(56,189,248,.65),inset 0 0 12px rgba(56,189,248,.35)}
  #bigBtn:active{transform:scale(.97)}
  #subBtn{margin-top:12px;background:transparent;border:none;color:#94a3b8;font-size:12px;text-decoration:underline}
  #foot{padding:6px 10px calc(8px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:#64748b;letter-spacing:.05em}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div><span class="hud-label">SCORE</span><b id="score">0</b></div>
    <div style="text-align:center"><span class="hud-label">WAVE</span><b id="wave">1</b></div>
    <div style="text-align:center"><span class="hud-label">MAX CHAIN</span><b id="chain">0</b></div>
    <div style="text-align:right"><span class="hud-label">LIFE</span><b id="lives">♥♥♥</b></div>
    <button id="pauseBtn">⏸</button>
  </div>
  <div id="game">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <h1>SABER<br>BREAKER<br><span class="pink" style="font-size:17px">― ルミナス・インベーダー崩し ―</span></h1>
      <p><b>左右ドラッグ</b>で移動、<b>上にスワイプ</b>でライトセイバーを振る！<br>
      敵の弾は壁で反射しながら飛んでくる。跳ね返すたびにその弾の<b>チェーン</b>が貯まって強くなり、編隊に混ざった<b>中ボス・大ボス</b>も壊せるようになる。<br>
      後ろに抜けた弾はセーフ、<b>体に当たるとダメージ</b>。編隊が最前線まで来たら終わりだ。</p>
      <button id="bigBtn">▶ ゲームスタート</button>
      <button id="subBtn">音 ON / OFF</button>
    </div>
  </div>
  <div id="foot">左右ドラッグで移動 ・ 上スワイプで振る ・ ⏸で一時停止</div>
</div>
<script>
"use strict";
// ===== SABER BREAKER v2 =====
// Spec (agreed 2026-10-27):
//  - Oblique depth view (trapezoid perspective, player near / back view)
//  - Move: drag left/right only. Swing the lightsaber: swipe up.
//  - Enemy balls bounce off the side walls like pinball on the way in.
//  - Returning a ball increments THAT ball's chain; chain = power vs hard enemies.
//  - A returned ball that destroys 1 invader comes back to the player (rally).
//  - Enemies keep firing extra balls during the rally.
//  - Ball passing behind the player is SAFE; a ball hitting the body = 1 damage.
//  - Invader formation moves sideways and creeps closer; reaching the front line = game over.
//  - Mid / big bosses are mixed into the normal formation (not separate boss stages).
// All motion is delta-time based so speed is identical at 60Hz / 120Hz.
const W = 420, H = 640;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let DPR = 1, CW = 0, CH = 0, SCALE = 1, OX = 0, OY = 0;
function resize(){
  const r = document.getElementById('game').getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
  CW = r.width; CH = r.height;
  SCALE = Math.min(CW / W, CH / H); OX = (CW - W * SCALE) / 2; OY = (CH - H * SCALE) / 2;
}
window.addEventListener('resize', resize);

// ---------- projection (depth) ----------
// Field coords: x in [-1,1] across, z in [0,1] depth (0 = far, 1 = near/player)
const VIEW = { cx: W / 2, horizon: 86, bottom: 612, farHalf: 74, nearHalf: 198 };
function proj(x, z){
  const zz = Math.max(0, Math.min(1.06, z));
  const half = VIEW.farHalf + (VIEW.nearHalf - VIEW.farHalf) * zz;
  return {
    x: VIEW.cx + x * half,
    y: VIEW.horizon + (VIEW.bottom - VIEW.horizon) * Math.pow(zz, 1.12),
    half, scale: 0.36 + 0.92 * zz
  };
}
function screenToFieldX(sx){ // inverse of proj at the player's depth
  const p = proj(0, PLAYER_Z);
  return (sx - p.x) / p.half;
}
const PLAYER_Z = 0.93, FRONTLINE_Z = 0.80, WALL_X = 1.0;

// ---------- audio ----------
let AC = null, muted = false;
function beep(f, d = 0.07, type = 'square', v = 0.05, slide = 0){
  if (muted) return;
  try{
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
  }catch(e){}
}
function swingSound(){ beep(180, 0.16, 'sawtooth', 0.035, 720); } // saber whoosh

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
const rand = (a, b) => a + Math.random() * (b - a);

// chain tiers (Luminous heat): colour of a ball's trail by its chain
function chainColor(chain){
  if (chain >= 8) return '#f0abfc';
  if (chain >= 5) return '#c084fc';
  if (chain >= 3) return '#f472b6';
  if (chain >= 1) return '#38bdf8';
  return '#ef4444'; // untouched enemy ball
}
function ballPower(chain){ return 1 + Math.floor(chain / 3); } // chain 0-2:1, 3-5:2, 6-8:3, 9+:4

// ---------- background stars ----------
const stars = []; for (let i = 0; i < 110; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.4, tw: Math.random() * 6.28 });

// ---------- game state ----------
let state = 'title'; // title | playing | paused | over | waveclear
let score = 0, hiScore = +(localStorage.getItem('saberBreakerHi') || 0), lives = 3, wave = 1;
let time = 0, waveClearT = 0, shake = 0, maxChain = 0;
let balls = [], particles = [], rings = [], flashes = [], pops = [];
let shootT = 1.6;

const player = { x: 0, targetX: 0, prevX: 0, speed: 0, swingT: 0, swingCd: 0, hurtT: 0, saberTrail: [] };

// ---------- invaders ----------
// Formation lives in field coords. Anchor (fx, fz) moves sideways and steps closer.
let units = [], form = { fx: 0, fz: 0.02, dir: 1, speed: 0.055 };
const COLS = 7, ROWS = 4, COL_DX = 0.245, ROW_DZ = 0.072;
const ROW_COL = ['#ef4444', '#c084fc', '#22d3ee', '#4ade80'];
const ROW_PTS = [30, 20, 20, 10];
const SPRITES = [
  ["X..X...X..X","XX..X.X..XX",".XXXXXXXXX.","..XXXXXXX..",".XX.XXX.XX.","XX.......XX","X.........X"], // TIE-ish (back)
  ["..X.....X..","...X...X...","..XXXXXXX..",".XXXXXXXXX.","XX.XXXXX.XX","X.........X","..X.....X.."], // crab
  ["...XXXX...",".XXXXXXXX.","XX.XXXX.XX","XXXXXXXXXX","..XX..XX..",".XX.XX.XX.","XX......XX"], // octopus
  [".X..XXX..X.","..XXXXXXX..",".XXXXXXXXX.","XX.XXXXX.XX","X.XX...XX.X","..X.....X..",".X.......X."], // fighter
];
function buildWave(){
  units = []; balls = []; particles = []; rings = []; pops = [];
  form = { fx: 0, fz: 0.02, dir: 1, speed: 0.05 + wave * 0.006 };
  shootT = 1.4;
  const occupied = new Set();
  const key = (c, r) => c + ',' + r;
  if (wave % 3 === 0){
    // big boss: spans cols 2..4, rows 0..1
    for (let r = 0; r <= 1; r++) for (let c = 2; c <= 4; c++) occupied.add(key(c, r));
    units.push({ kind: 'big', col: 3, row: 0, rows: 2, wCells: 3, hp: 14 + wave * 2, maxHp: 14 + wave * 2, pts: 500, flashT: 0 });
  } else {
    // mid boss: centre column, rows 0..1 (tall)
    occupied.add(key(3, 0)); occupied.add(key(3, 1));
    units.push({ kind: 'mid', col: 3, row: 0, rows: 2, wCells: 1, hp: 6 + wave, maxHp: 6 + wave, pts: 200, flashT: 0 });
    if (wave >= 4){ // side mid-bosses join in later waves
      occupied.add(key(0, 0)); occupied.add(key(6, 0));
      units.push({ kind: 'mid', col: 0, row: 0, rows: 1, wCells: 1, hp: 6 + wave, maxHp: 6 + wave, pts: 200, flashT: 0 });
      units.push({ kind: 'mid', col: 6, row: 0, rows: 1, wCells: 1, hp: 6 + wave, maxHp: 6 + wave, pts: 200, flashT: 0 });
    }
  }
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    if (occupied.has(key(c, r))) continue;
    units.push({ kind: 'normal', col: c, row: r, rows: 1, wCells: 1, hp: r === 0 ? 2 : 1, maxHp: r === 0 ? 2 : 1, pts: ROW_PTS[r], flashT: 0 });
  }
  units.forEach(u => u.alive = true);
}
function unitPos(u){
  // centre in field coords
  const x = form.fx + (u.col - (COLS - 1) / 2) * COL_DX;
  const z = form.fz + u.row * ROW_DZ + (u.rows - 1) * ROW_DZ / 2;
  const wF = (u.kind === 'big' ? 0.62 : u.kind === 'mid' ? 0.30 : 0.19);
  const dF = (u.rows > 1 ? 0.13 : 0.055);
  return { x, z, wF, dF };
}
function aliveUnits(){ return units.filter(u => u.alive); }

function resetGame(){ score = 0; lives = 3; wave = 1; maxChain = 0; buildWave(); updateHud(); }
function updateHud(){
  document.getElementById('score').textContent = score;
  document.getElementById('wave').textContent = wave;
  document.getElementById('chain').textContent = maxChain;
  document.getElementById('lives').textContent = '♥'.repeat(Math.max(0, lives)) || '―';
}
function addScore(n){ score += n; if (score > hiScore){ hiScore = score; localStorage.setItem('saberBreakerHi', hiScore); } updateHud(); }

// ---------- effects ----------
function burstAt(x, z, col, n = 12, sp = 1){
  const p = proj(x, z);
  for (let i = 0; i < n; i++){ const a = Math.random() * 6.283, s = rand(30, 150) * sp;
    particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: rand(.3, .7), t: 0, col, size: rand(1.5, 3.4) }); }
}
function ringAt(x, z, col){ const p = proj(x, z); rings.push({ x: p.x, y: p.y, r: 6, t: 0, col }); }
function pop(text, col, big){ pops.push({ text, col, t: 0, big: !!big }); }

// ---------- balls ----------
function ballSpeed(){ return 0.52 + wave * 0.028; }
function spawnEnemyBall(){
  const alive = aliveUnits(); if (!alive.length) return;
  const shooters = alive.filter(u => u.row >= 2 || u.kind !== 'normal');
  const src = (shooters.length ? shooters : alive)[Math.floor(Math.random() * (shooters.length ? shooters.length : alive.length))];
  const p = unitPos(src);
  const S = ballSpeed();
  const ang = rand(0.35, 0.75) * (Math.random() < 0.5 ? -1 : 1); // diagonal so it pinballs off the walls
  balls.push({ x: p.x, z: p.z + 0.04, vx: Math.sin(ang) * S, vz: Math.cos(ang) * S, chain: 0, returned: false, resolved: false, trail: [] });
  beep(880, 0.07, 'square', 0.02, -420);
}
function maxBalls(){ return Math.min(2 + Math.floor((wave - 1) / 2), 4); }

function damage(){
  if (player.hurtT > 0) return;
  lives--; updateHud(); player.hurtT = 1.4; shake = 0.35;
  beep(160, 0.25, 'sawtooth', 0.07, -110);
  burstAt(player.x, PLAYER_Z, '#ef4444', 18, 1.2);
  flashes.push({ col: '#ef4444', t: 0 });
  if (lives <= 0) gameOver();
}
function gameOver(){
  state = 'over';
  const ov = document.getElementById('overlay');
  ov.querySelector('h1').innerHTML = '<span class="pink">GAME OVER</span>';
  ov.querySelector('p').innerHTML = `帝国軍の侵攻を止められなかった…<br>SCORE <b>${score}</b> ／ WAVE <b>${wave}</b> ／ MAX CHAIN <b>${maxChain}</b>`;
  document.getElementById('bigBtn').textContent = '↻ もう一度';
  ov.classList.remove('hidden');
  beep(220, 0.5, 'sawtooth', 0.06, -160);
}

// ---------- update ----------
function update(dt){
  time += dt;
  if (shake > 0) shake -= dt;
  particles = particles.filter(p => (p.t += dt) < p.life);
  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; });
  rings = rings.filter(r => (r.t += dt) < 0.35);
  flashes = flashes.filter(f => (f.t += dt) < 0.22);
  pops = pops.filter(p => (p.t += dt) < 0.9);
  if (state !== 'playing') return;

  // player: left/right only, delta-time
  player.prevX = player.x;
  const dx = player.targetX - player.x;
  player.x += clamp(dx, -1.9 * dt, 1.9 * dt);
  player.x = clamp(player.x, -0.88, 0.88);
  player.speed = dt > 0 ? (player.x - player.prevX) / dt : 0;
  if (player.swingT > 0) player.swingT -= dt;
  if (player.swingCd > 0) player.swingCd -= dt;
  if (player.hurtT > 0) player.hurtT -= dt;
  player.saberTrail = player.saberTrail.filter(s => (s.t += dt) < 0.3);

  // formation: sideways, step closer at each edge (invader style)
  const alive = aliveUnits();
  if (!alive.length){ state = 'waveclear'; waveClearT = 1.6; addScore(200); pop('WAVE CLEAR!', '#38bdf8', true); beep(660, 0.12, 'square', 0.05, 440); return; }
  const speedBoost = 1 + (units.length - alive.length) / units.length * 1.3;
  form.fx += form.dir * form.speed * speedBoost * dt;
  let minX = 1e9, maxX = -1e9, maxZ = -1e9;
  alive.forEach(u => { const p = unitPos(u); minX = Math.min(minX, p.x - p.wF / 2); maxX = Math.max(maxX, p.x + p.wF / 2); maxZ = Math.max(maxZ, p.z + p.dF / 2); if (u.flashT > 0) u.flashT -= dt; });
  if (minX < -0.97 && form.dir < 0){ form.dir = 1; form.fz += 0.028; }
  if (maxX > 0.97 && form.dir > 0){ form.dir = -1; form.fz += 0.028; }
  if (maxZ >= FRONTLINE_Z){ gameOver(); return; }

  // enemy fire (also during a rally)
  shootT -= dt;
  if (shootT <= 0){
    shootT = rand(1.5, 2.6) * Math.max(0.5, 1 - (wave - 1) * 0.07);
    if (balls.length < maxBalls()) spawnEnemyBall();
  }

  // balls
  for (const b of balls){
    const S = Math.max(ballSpeed() + b.chain * 0.022, Math.hypot(b.vx, b.vz));
    b.trail.push({ x: b.x, z: b.z }); if (b.trail.length > 22) b.trail.shift();
    b.x += b.vx * dt; b.z += b.vz * dt;
    // pinball side walls
    if (b.x < -WALL_X + 0.03){ b.x = -WALL_X + 0.03; b.vx = Math.abs(b.vx); burstAt(b.x, b.z, '#67e8f9', 4, 0.6); beep(300, 0.04, 'square', 0.025); }
    if (b.x > WALL_X - 0.03){ b.x = WALL_X - 0.03; b.vx = -Math.abs(b.vx); burstAt(b.x, b.z, '#67e8f9', 4, 0.6); beep(300, 0.04, 'square', 0.025); }
    // far wall: a returned ball that misses everyone bounces back
    if (b.z < 0.015 && b.vz < 0){ b.z = 0.015; b.vz = Math.abs(b.vz); ringAt(b.x, b.z, '#f472b6'); beep(340, 0.05, 'square', 0.03); }

    // invader collision (only matters while travelling, either direction)
    for (const u of aliveUnits()){
      if (!u.alive) continue;
      const p = unitPos(u);
      if (Math.abs(b.x - p.x) < p.wF / 2 + 0.03 && Math.abs(b.z - p.z) < p.dF / 2 + 0.026){
        const dmg = b.returned ? ballPower(b.chain) : 1;
        if (!b.returned){
          // an enemy ball touching its own side does nothing (it was just fired)
          continue;
        }
        u.hp -= dmg; u.flashT = 0.14;
        burstAt(p.x, p.z, ROW_COL[u.row] || '#f472b6', u.kind === 'normal' ? 14 : 22, 1.1);
        ringAt(p.x, p.z, chainColor(b.chain));
        if (u.hp <= 0){
          u.alive = false; addScore(u.pts);
          burstAt(p.x, p.z, '#ffffff', 10, 1.2); shake = Math.max(shake, u.kind === 'normal' ? 0.1 : 0.28);
          beep(u.kind === 'normal' ? 200 : 120, 0.18, 'square', 0.06, -120);
          if (u.kind !== 'normal') pop(u.kind === 'big' ? 'BIG BOSS DOWN!' : 'MID BOSS DOWN!', '#facc15', true);
        } else {
          beep(520, 0.07, 'square', 0.045, -160);
          if (u.kind !== 'normal') pop('HIT! 残り ' + u.hp, '#facc15', false);
        }
        // rally rule: after hitting one, the ball comes back to the player
        b.vz = Math.abs(S) * 0.88; b.vx = clamp(b.vx + (b.x - p.x) * 1.4, -S * 0.8, S * 0.8);
        const ns = Math.hypot(b.vx, b.vz); b.vx *= S / ns; b.vz *= S / ns;
        b.z = p.z + p.dF / 2 + 0.03;
        break;
      }
    }
    if (b.z < 0.80) b.resolved = false;

    // reaching the player's plane
    if (b.vz > 0 && b.z >= PLAYER_Z - 0.02 && !b.resolved){
      b.resolved = true;
      const dxp = b.x - player.x;
      if (player.swingT > 0 && Math.abs(dxp) < 0.30){
        // RETURN! chain grows for this ball
        b.chain++; b.returned = true;
        if (b.chain > maxChain){ maxChain = b.chain; updateHud(); }
        const S2 = ballSpeed() + b.chain * 0.022;
        const rel = clamp(dxp / 0.30, -1, 1);
        b.vz = -Math.cos(rel * 0.85) * S2; b.vx = Math.sin(rel * 0.85) * S2 + player.speed * 0.08;
        const ns = Math.hypot(b.vx, b.vz); b.vx *= S2 / ns; b.vz *= S2 / ns;
        b.z = PLAYER_Z - 0.04;
        burstAt(b.x, PLAYER_Z, chainColor(b.chain), 12, 1.1); ringAt(b.x, PLAYER_Z, chainColor(b.chain));
        flashes.push({ col: chainColor(b.chain), t: 0 });
        if (b.chain >= 2) pop(b.chain + ' CHAIN!', chainColor(b.chain), b.chain >= 4);
        beep(660 + b.chain * 60, 0.08, 'square', 0.05, 220);
      } else if (Math.abs(dxp) < 0.105){
        // direct body hit
        b.z = 99; // remove below
        if (b.chain >= 3) pop('CHAIN BREAK', '#ef4444', true);
        damage(); if (state !== 'playing') return;
      }
      // otherwise: it slips past -> safe, removed when z > 1.05
    }
  }
  // remove spent balls
  balls = balls.filter(b => {
    if (b.z > 1.05){
      if (b.chain >= 3) pop('CHAIN BREAK', '#f87171', false);
      return false;
    }
    return b.z < 90;
  });
}

// ---------- drawing ----------
function drawField(){
  // floor trapezoid
  const fl = proj(-1, 0), fr = proj(1, 0), nr = proj(1, 1), nl = proj(-1, 1);
  const g = ctx.createLinearGradient(0, VIEW.horizon, 0, VIEW.bottom);
  g.addColorStop(0, '#12042e'); g.addColorStop(1, '#1e0a44');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(fl.x, fl.y); ctx.lineTo(fr.x, fr.y); ctx.lineTo(nr.x, nr.y); ctx.lineTo(nl.x, nl.y); ctx.closePath(); ctx.fill();
  // depth grid lines
  ctx.lineWidth = 1;
  for (let i = 0; i <= 8; i++){ const z = i / 8; const a = proj(-1, z), b = proj(1, z);
    ctx.strokeStyle = `rgba(34,211,238,${0.05 + z * 0.13})`; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  for (const sx of [-1, -0.5, 0, 0.5, 1]){ const a = proj(sx, 0), b = proj(sx, 1);
    ctx.strokeStyle = 'rgba(34,211,238,.10)'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  // glowing side walls (the pinball walls)
  ctx.save(); ctx.shadowBlur = 9;
  ctx.strokeStyle = '#22d3ee'; ctx.shadowColor = '#22d3ee'; ctx.lineWidth = 2;
  let a = proj(-1, 0), b = proj(-1, 1); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.strokeStyle = '#f472b6'; ctx.shadowColor = '#f472b6';
  a = proj(1, 0); b = proj(1, 1); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.restore();
  // front line (invasion limit)
  const f1 = proj(-1, FRONTLINE_Z), f2 = proj(1, FRONTLINE_Z);
  ctx.strokeStyle = 'rgba(239,68,68,.55)'; ctx.setLineDash([7, 6]); ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(f1.x, f1.y); ctx.lineTo(f2.x, f2.y); ctx.stroke(); ctx.setLineDash([]);
}
function drawInvader(u){
  const p = unitPos(u), pr = proj(p.x, p.z);
  const wPx = p.wF * pr.half, hPx = wPx * 0.78;
  const col = u.kind === 'big' ? '#f87171' : u.kind === 'mid' ? '#fb923c' : ROW_COL[u.row];
  ctx.save();
  if (u.kind === 'normal'){
    const spr = SPRITES[u.row], cell = wPx / spr[0].length;
    ctx.shadowColor = u.flashT > 0 ? '#fff' : col; ctx.shadowBlur = 9;
    ctx.fillStyle = u.flashT > 0 ? '#fff' : col;
    const bob = (Math.floor(time * 2) % 2 === 0) ? 0 : cell * 0.35;
    spr.forEach((row, ri) => { for (let ci = 0; ci < row.length; ci++){
      if (row[ci] !== 'X') continue;
      let yy = pr.y - hPx / 2 + ri * cell; if (ri >= spr.length - 2) yy += bob - cell * 0.35;
      ctx.fillRect(pr.x - wPx / 2 + ci * cell, yy, cell + 0.6, cell + 0.6);
    }});
  } else {
    // boss: angular destroyer-like hull + red core, scaled by kind
    const bw = wPx, bh = (u.kind === 'big' ? wPx * 0.52 : wPx * 0.95);
    ctx.shadowColor = u.flashT > 0 ? '#fff' : col; ctx.shadowBlur = 16;
    ctx.fillStyle = u.flashT > 0 ? '#fff' : '#1f2430';
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();
    if (u.kind === 'big'){
      ctx.moveTo(pr.x - bw / 2, pr.y + bh / 2); ctx.lineTo(pr.x - bw * 0.18, pr.y - bh / 2); ctx.lineTo(pr.x + bw * 0.18, pr.y - bh / 2); ctx.lineTo(pr.x + bw / 2, pr.y + bh / 2); ctx.lineTo(pr.x, pr.y + bh * 0.22);
    } else {
      ctx.moveTo(pr.x - bw / 2, pr.y - bh / 2); ctx.lineTo(pr.x + bw / 2, pr.y - bh / 2); ctx.lineTo(pr.x + bw / 2, pr.y + bh / 2); ctx.lineTo(pr.x - bw / 2, pr.y + bh / 2);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // wing panels
    ctx.fillStyle = hexA(col, 0.5);
    ctx.fillRect(pr.x - bw * 0.46, pr.y - bh * 0.12, bw * 0.26, bh * 0.24);
    ctx.fillRect(pr.x + bw * 0.20, pr.y - bh * 0.12, bw * 0.26, bh * 0.24);
    // red core
    ctx.fillStyle = '#ef4444'; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(pr.x, pr.y, Math.max(3.4, bw * 0.075), 0, 6.283); ctx.fill();
    // HP bar
    ctx.shadowBlur = 0; const ratio = Math.max(0, u.hp / u.maxHp);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(pr.x - bw / 2, pr.y - bh / 2 - 8 * pr.scale, bw, 3.4);
    ctx.fillStyle = ratio > 0.4 ? '#facc15' : '#ef4444'; ctx.fillRect(pr.x - bw / 2, pr.y - bh / 2 - 8 * pr.scale, bw * ratio, 3.4);
  }
  ctx.restore();
}
function drawCharacter(){
  const pr = proj(player.x, PLAYER_Z);
  const x = pr.x, y = pr.y, u = 5.4; // pixel unit (near scale)
  // aura + foot ring (cyan, your side - same as Luminous tennis)
  const ag = ctx.createRadialGradient(x, y - 18, 0, x, y - 18, 52);
  ag.addColorStop(0, 'rgba(34,211,238,0.20)'); ag.addColorStop(1, 'rgba(34,211,238,0)');
  ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(x, y - 18, 52, 0, 6.283); ctx.fill();
  ctx.save(); ctx.strokeStyle = '#22d3ee'; ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 9; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.ellipse(x, y + 15, 24, 7.5, 0, 0, 6.283); ctx.stroke(); ctx.restore();
  if (player.hurtT > 0 && Math.floor(time * 14) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, y + 15, 20, 6.5, 0, 0, 6.283); ctx.fill();
  // legs (run cycle)
  const moving = Math.abs(player.speed) > 0.25, run = moving ? Math.floor(time * 10) % 2 : -1;
  [[-4, 0], [2, 1]].forEach(([off, side]) => {
    const len = (run === -1 ? 3 : (side === 0) === (run === 0) ? 3.2 : 1.8) * u * 0.88;
    ctx.fillStyle = '#e7d8bd'; ctx.fillRect(x + off * u * 0.88, y, 2 * u * 0.88, len);
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(x + off * u * 0.88, y + len, 2 * u * 0.88, 0.8 * u * 0.88);
    ctx.fillStyle = '#1f2937'; ctx.fillRect(x + (off - 0.3) * u * 0.88, y + len + 0.8 * u * 0.88, 2.6 * u * 0.88, 1.2 * u * 0.88);
  });
  // body sprite: back view, Jedi-like hood + robe colours
  const HEAD_BACK = ["....CCCCCC....","..CCCCCCCCCC..","..CCCCCCCCCC..","..CCCCCCCCCC..","..CCCCCCCCCC..","...SSSSSSSS..."];
  const BODY = [".ATTTTTTTTTTA.",".ATTTTTTTTTTA.","..TTTTTTTTTT..","..TTTTTTTTTT..","..WWWWWWWWWW..","..BBBBBBBBBB.."];
  const pal = { C: '#57534e', S: '#ffd9b3', T: '#d6c7a8', A: '#ffd9b3', W: '#a89a7d', B: '#44403c' };
  const top = y - 12 * u * 0.88;
  HEAD_BACK.concat(BODY).forEach((row, ri) => { for (let ci = 0; ci < row.length; ci++){
    const ch = row[ci]; if (ch === '.') continue; ctx.fillStyle = pal[ch];
    ctx.fillRect(x - 7 * u * 0.88 + ci * u * 0.88, top + ri * u * 0.88, u * 0.88 + 0.5, u * 0.88 + 0.5);
  }});
  ctx.globalAlpha = 1;
  // ---- lightsaber arm + saber (same construction as Luminous tennis) ----
  // idle: saber up/out. Swing (0.24s): sweeps through, leaving fan afterimages.
  let th = -0.9;
  if (player.swingT > 0){ const q = 1 - player.swingT / 0.24; th = -2.35 + 2.9 * q; }
  const sx = x + 5.2 * 2, sy = y - 4.5 * 2 - 14, hx = sx + Math.cos(th) * 3.2 * 2, hy = sy + Math.sin(th) * 3.2 * 2;
  ctx.strokeStyle = '#ffd9b3'; ctx.lineWidth = 4.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sx - 8, sy + 2); ctx.lineTo(hx, hy); ctx.stroke();
  const saber = '#38bdf8', saberPale = '#bae6fd';
  const dxv = Math.cos(th), dyv = Math.sin(th);
  const bx = hx + dxv * 1.2 * 2, by = hy + dyv * 1.2 * 2;
  const txp = hx + dxv * 11.5 * 2, typ = hy + dyv * 11.5 * 2;
  if (player.swingT > 0) player.saberTrail.push({ bx, by, tx: txp, ty: typ, t: 0 });
  ctx.save(); ctx.lineCap = 'round';
  player.saberTrail.forEach(sp => {
    const k = 1 - sp.t / 0.3;
    ctx.globalAlpha = k * 0.45; ctx.strokeStyle = saber; ctx.shadowColor = saber; ctx.shadowBlur = 10; ctx.lineWidth = 3 + 10 * k;
    ctx.beginPath(); ctx.moveTo(sp.bx, sp.by); ctx.lineTo(sp.tx, sp.ty); ctx.stroke();
    ctx.globalAlpha = k * 0.5; ctx.strokeStyle = '#fff'; ctx.shadowBlur = 0; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(sp.bx, sp.by); ctx.lineTo(sp.tx, sp.ty); ctx.stroke();
  });
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 4.6;
  ctx.beginPath(); ctx.moveTo(hx - dxv * 1.2, hy - dyv * 1.2); ctx.lineTo(bx, by); ctx.stroke();
  ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 4.8;
  ctx.beginPath(); ctx.moveTo(hx + dxv * 0.9, hy + dyv * 0.9); ctx.lineTo(hx + dxv * 1.7, hy + dyv * 1.7); ctx.stroke();
  const flick = 0.9 + 0.1 * Math.sin(time * 26 + player.x * 8);
  ctx.strokeStyle = saber; ctx.shadowColor = saber; ctx.shadowBlur = (player.swingT > 0 ? 22 : 15) * flick;
  ctx.globalAlpha = 0.9; ctx.lineWidth = 10.4;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(txp, typ); ctx.stroke();
  ctx.strokeStyle = saberPale; ctx.shadowBlur = 8; ctx.globalAlpha = 0.95; ctx.lineWidth = 5.8;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(txp, typ); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.lineWidth = 3.1;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(txp, typ); ctx.stroke();
  ctx.restore();
}
function drawBall(b){
  // ribbon trail (grows / recolours with chain - Luminous heat style)
  const col = chainColor(b.chain);
  const n = Math.min(b.trail.length, 10 + b.chain * 2);
  const pts = b.trail.slice(-n);
  pts.forEach((t, i) => {
    const k = i / Math.max(1, pts.length), pp = proj(t.x, t.z);
    ctx.globalAlpha = k * 0.34; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(pp.x, pp.y, (2 + 5 * k) * pp.scale + b.chain * 0.14, 0, 6.283); ctx.fill();
  });
  ctx.globalAlpha = 1;
  const pr = proj(b.x, b.z);
  // ground marker so the player can judge where it will arrive
  ctx.save(); ctx.strokeStyle = hexA(col, 0.65); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(pr.x, proj(b.x, b.z).y + 16 * pr.scale, 10 * pr.scale, 3.6 * pr.scale, 0, 0, 6.283); ctx.stroke(); ctx.restore();
  const r = 6.4 * pr.scale + Math.min(3, b.chain * 0.3);
  ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 18;
  const g = ctx.createRadialGradient(pr.x - 2, pr.y - 2, 0, pr.x, pr.y, r + 1);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, hexA(col, 0.95)); g.addColorStop(1, 'rgba(2,6,23,0.9)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pr.x, pr.y, r, 0, 6.283); ctx.fill(); ctx.restore();
  if (b.chain >= 2){ ctx.fillStyle = col; ctx.font = `bold ${Math.round(11 * pr.scale + 3)}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText('×' + b.chain, pr.x, pr.y - r - 5); }
}
function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05010f'; ctx.fillRect(0, 0, CW, CH);
  ctx.save(); ctx.translate(OX, OY); ctx.scale(SCALE, SCALE);
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 10, rand(-1, 1) * shake * 8);
  for (const st of stars){ ctx.globalAlpha = 0.3 + 0.3 * Math.sin(time * 2 + st.tw); ctx.fillStyle = '#e0f2fe'; ctx.fillRect(st.x, st.y, st.s, st.s); }
  ctx.globalAlpha = 1;
  // distant destroyer silhouette (Star-Wars-flavoured backdrop)
  ctx.fillStyle = 'rgba(88,80,140,0.20)';
  ctx.beginPath(); ctx.moveTo(W * 0.58, 18); ctx.lineTo(W * 0.97, 30); ctx.lineTo(W * 0.80, 52); ctx.lineTo(W * 0.64, 44); ctx.closePath(); ctx.fill();
  ctx.fillRect(W * 0.74, 22, 12, 7);
  drawField();
  // invaders far -> near (painter's order by z)
  aliveUnits().slice().sort((a, b) => unitPos(a).z - unitPos(b).z).forEach(drawInvader);
  balls.forEach(drawBall);
  drawCharacter();
  for (const p of particles){ ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  for (const r of rings){ const k = r.t / 0.35; ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.col; ctx.shadowColor = r.col; ctx.shadowBlur = 10; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r + k * 32, 0, 6.283); ctx.stroke(); ctx.restore(); }
  for (const f of flashes){ ctx.fillStyle = hexA(f.col, (1 - f.t / 0.22) * 0.10); ctx.fillRect(0, 0, W, H); }
  // big centre pops (CHAIN! etc.)
  for (const p of pops){ const k = p.t / 0.9, sc = p.big ? 34 : 21;
    ctx.save(); ctx.globalAlpha = k < 0.15 ? k / 0.15 : 1 - Math.max(0, k - 0.6) / 0.4;
    ctx.translate(W / 2, H * 0.38); ctx.scale(1 + 0.25 * Math.sin(Math.min(1, k * 3) * Math.PI), 1 + 0.25 * Math.sin(Math.min(1, k * 3) * Math.PI));
    ctx.fillStyle = p.col; ctx.font = `bold ${sc}px sans-serif`; ctx.textAlign = 'center'; ctx.shadowColor = p.col; ctx.shadowBlur = 20;
    ctx.fillText(p.text, 0, 0); ctx.restore(); }
  if (state === 'waveclear'){ ctx.fillStyle = '#fff'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center'; ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 22; ctx.fillText('WAVE CLEAR!', W / 2, H / 2); ctx.shadowBlur = 0; }
  if (state === 'paused'){ ctx.fillStyle = 'rgba(5,1,15,.6)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('PAUSED', W / 2, H / 2); }
  ctx.restore();
}

// ---------- main loop ----------
let lastT = performance.now();
function loop(now){
  let dt = (now - lastT) / 1000; lastT = now;
  dt = Math.min(dt, 0.05);
  if (state === 'waveclear'){ waveClearT -= dt; particles = particles.filter(p => (p.t += dt) < p.life); pops = pops.filter(p => (p.t += dt) < 0.9);
    if (waveClearT <= 0){ wave++; buildWave(); updateHud(); state = 'playing'; } }
  else update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------- input: drag = move (x only), swipe up = swing ----------
function toFieldX(clientX){
  const r = cv.getBoundingClientRect();
  return clamp(screenToFieldX((clientX - r.left - OX) / SCALE), -0.95, 0.95);
}
function doSwing(){
  if (state !== 'playing' || player.swingCd > 0) return;
  player.swingT = 0.24; player.swingCd = 0.30;
  swingSound();
}
let ptr = null; // {id, startX, startY, startT, samples:[{x,y,t}], swiped}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  ptr = { id: e.pointerId, startX: e.clientX, startY: e.clientY, startT: performance.now(), samples: [{ x: e.clientX, y: e.clientY, t: performance.now() }], swiped: false };
  player.targetX = toFieldX(e.clientX);
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  e.preventDefault();
  player.targetX = toFieldX(e.clientX);
  const now = performance.now();
  ptr.samples.push({ x: e.clientX, y: e.clientY, t: now });
  ptr.samples = ptr.samples.filter(s => now - s.t < 130);
  // swipe up detection: fast upward motion inside the recent window
  if (!ptr.swiped && ptr.samples.length >= 2){
    const s0 = ptr.samples[0], s1 = ptr.samples[ptr.samples.length - 1];
    const dt = (s1.t - s0.t) / 1000, dy = s1.y - s0.y;
    if (dt > 0.02 && dy < -34 && dy / dt < -620){
      ptr.swiped = true; doSwing();
    }
  }
}, { passive: false });
function endPtr(e){
  if (!ptr || e.pointerId !== ptr.id) return;
  const dt = (performance.now() - ptr.startT) / 1000, dy = e.clientY - ptr.startY, dx = e.clientX - ptr.startX;
  if (!ptr.swiped && dt < 0.38 && dy < -52 && Math.abs(dy) > Math.abs(dx) * 1.15) doSwing(); // quick flick released fast
  ptr = null;
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', () => ptr = null);
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'ArrowUp'){ doSwing(); e.preventDefault(); }
  if (e.key === 'p' || e.key === 'P') togglePause();
});
window.addEventListener('keyup', e => keys[e.key] = false);
setInterval(() => { if (state !== 'playing') return;
  if (keys['ArrowLeft'] || keys['a']) player.targetX = clamp(player.targetX - 0.06, -0.95, 0.95);
  if (keys['ArrowRight'] || keys['d']) player.targetX = clamp(player.targetX + 0.06, -0.95, 0.95);
}, 16);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());

function togglePause(){
  if (state === 'playing') state = 'paused';
  else if (state === 'paused'){ state = 'playing'; lastT = performance.now(); }
}
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('subBtn').addEventListener('click', () => { muted = !muted; document.getElementById('subBtn').textContent = muted ? '音 OFF 中（タップでON）' : '音 ON / OFF'; });
document.getElementById('bigBtn').addEventListener('click', () => {
  beep(440, 0.08, 'square', 0.05, 220);
  document.getElementById('overlay').querySelector('h1').innerHTML = 'SABER<br>BREAKER<br><span class="pink" style="font-size:17px">― ルミナス・インベーダー崩し ―</span>';
  resetGame(); document.getElementById('overlay').classList.add('hidden');
  state = 'playing'; lastT = performance.now();
});

resize(); buildWave(); updateHud();
requestAnimationFrame(() => { resize(); requestAnimationFrame(loop); });
</script>
</body>
